# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft / NeoForge version info.
# Check https://projects.neoforged.net/neoforged/neoforge for the exact latest
# 1.21.1 build number and update neoforge_version below before building.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.72
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod properties.
mod_id=fredplenter
mod_name=Fredplenter
mod_license=MIT
mod_version=0.0.1
mod_group_id=com.fredplenter
mod_authors=Fredplenter contributors
mod_description=An original, open-source Thaumonomicon-inspired magic mod for NeoForge 1.21.1. Research your own arcane knowledge at the Arcane Table.
